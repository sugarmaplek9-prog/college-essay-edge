name: first-minute-surface-gates

on:
  pull_request:
    paths:
      - 'src/lib/fm/canonicalPage3Payload.ts'
      - 'src/lib/fm/openingCoach.ts'
      - 'src/app/start/direction/**'
      - 'src/app/start/opening/**'
      - 'src/app/start/reflecting/**'
      - 'src/components/firstMinute/**'
      - 'src/lib/fm/output-quality.ts'
      - 'src/__tests__/unit/page3-surface-integrity.spec.ts'
      - 'src/__tests__/unit/opening-coach-ordering.spec.ts'
      - 'src/__tests__/unit/opening-coach.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/first-minute-surface-gates.yml'
      - 'docs/engineering/page3-controlled-testing-readiness-v1.md'
      - 'docs/engineering/V1_0_1_HOTFIX_PLAN.md'
  push:
    branches:
      - main
    paths:
      - 'src/lib/fm/canonicalPage3Payload.ts'
      - 'src/lib/fm/openingCoach.ts'
      - 'src/app/start/direction/**'
      - 'src/app/start/opening/**'
      - 'src/app/start/reflecting/**'
      - 'src/components/firstMinute/**'
      - 'src/lib/fm/output-quality.ts'
      - 'src/__tests__/unit/page3-surface-integrity.spec.ts'
      - 'src/__tests__/unit/opening-coach-ordering.spec.ts'
      - 'src/__tests__/unit/opening-coach.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/first-minute-surface-gates.yml'

concurrency:
  group: first-minute-surface-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-minute-surface-gates:
    name: first-minute-surface-gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run page 3/page 4 surface gate tests
        run: npm run test:first-minute:surface-gates